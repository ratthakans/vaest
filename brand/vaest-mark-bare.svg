<!-- The slash with no container, for placing on a surface that already has one — a dark panel,
     a photograph, a letterhead. Same geometry as vaest-mark.svg with the tile removed, so the two
     stay in step if either is ever redrawn. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="VÆST">
  <defs>
    <linearGradient id="vaest-prism-bare" gradientUnits="userSpaceOnUse" x1="25.5" y1="8" x2="14.5" y2="32">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset=".5" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#eb5939"/>
    </linearGradient>
  </defs>
  <path d="M25.5 8 14.5 32" stroke="url(#vaest-prism-bare)" stroke-width="3.6" stroke-linecap="round"/>
</svg>
